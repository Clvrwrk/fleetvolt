services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetvolt}
      POSTGRES_DB: ${POSTGRES_DB:-fleetvolt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetvolt} -d ${POSTGRES_DB:-fleetvolt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # sim-worker + redis retired in Phase 13 — physics runs as Convex action
  simulator:
    build: ./services/simulator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleetvolt}:${POSTGRES_PASSWORD:-fleetvolt}@postgres:5432/${POSTGRES_DB:-fleetvolt}
      NREL_API_KEY: ${NREL_API_KEY:-}
      PTV_DEVELOPER_API_KEY: ${PTV_DEVELOPER_API_KEY:-}
      PORT: "8000"
      PYTHONPATH: /app:/data
      FLEETVOLT_DATA_ROOT: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.bootstrap_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetvolt}:${POSTGRES_PASSWORD:-fleetvolt}@postgres:5432/${POSTGRES_DB:-fleetvolt}
      # SIMULATOR_URL retained for Fastify proxy routes (meta/stack, trucks,
      # corridors, chargers, routing, physics/validation). Simulation routes
      # are deprecated (13-04) — physics runs as a Convex action. PDF export
      # moves to Convex in 13-05.
      SIMULATOR_URL: http://simulator:8000
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:4000
      PORT: "3000"
    depends_on:
      - api

volumes:
  postgres_data:
