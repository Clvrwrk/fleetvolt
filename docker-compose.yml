services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetvolt}
      POSTGRES_DB: ${POSTGRES_DB:-fleetvolt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetvolt} -d ${POSTGRES_DB:-fleetvolt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    environment:
      tile_urls: ""
    volumes:
      - ./data/valhalla/custom_files:/custom_files
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 3600s

  simulator:
    build: ./services/simulator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleetvolt}:${POSTGRES_PASSWORD:-fleetvolt}@postgres:5432/${POSTGRES_DB:-fleetvolt}
      VALHALLA_URL: http://valhalla:8002
      NREL_API_KEY: ${NREL_API_KEY:-}
      PORT: "8000"
      PYTHONPATH: /app:/data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  sim-worker:
    build: ./services/simulator
    command: celery -A app.worker worker -c 2 --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleetvolt}:${POSTGRES_PASSWORD:-fleetvolt}@postgres:5432/${POSTGRES_DB:-fleetvolt}
      CELERY_BROKER_URL: redis://redis:6379/0
      VALHALLA_URL: http://valhalla:8002
      PYTHONPATH: /app:/data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulator:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetvolt}:${POSTGRES_PASSWORD:-fleetvolt}@postgres:5432/${POSTGRES_DB:-fleetvolt}
      SIMULATOR_URL: http://simulator:8000
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:4000
      PORT: "3000"
    depends_on:
      - api

volumes:
  postgres_data:
